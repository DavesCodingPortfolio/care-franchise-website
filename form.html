<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>fieldset and legend example</title>
  </head>

<form action="/submit-form" method="post">
  <fieldset>
    <legend>Contact Details</legend>
  
<div>  
   <p><label for="name">Name:</label> 
   <input type="text" id="name" name="user_name" /></p>
 </div> 
  
<div>
	<p><label for="address1">Address line 1:</label> 
	<input type="text" id="address1" name="address-line-1" /></p>
</div>

<div>	
	<p><label for="address2">Address line 2:</label> 
	<input type="text" id="address2" name="address-line2" /></p>
</div>

<div>	
	<p><label for="towncity">Town / City:</label> 
	<input type="text" id="towncity" name="towncity" /></p>
</div>

<div>
	<p><label for="postcode">Post Code:</label> 
	<input type="text" id="postcode" name="postcode" /></p>
</div>

<div>	
	<p><label for="telephone">Telephone:</label> 
	<input type="text" id="telephone" name="telephone" /></p>
</div>	
	
<div>
	<p><label for="email">E-mail:</label> 
	<input type="email" id="email" name="email" /></p>
</div>

</fieldset>
<br>
<fieldset>
<legend>Further Information</legend>

<div>
	<p><label for="investment">Available Investment Amount:</label> 
	<input type="text" id="investment" name="investment" /></p>
</div>

<div>
	<p><label for="experience">Current occupation/business experience:</label> 
	<textarea id="experience" name="experience" /></textarea></p>
</div>

<div>
	<p><label for="reason">Reason for Interest in Hartley Management:</label> 
	<input type="text" id="reason" name="reason" /></p>
</div>

</fieldset>

<p class="button">
  <button type="submit">Send your message</button>
</p>

</form>
